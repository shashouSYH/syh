<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人网站</title>
  <style>
    :root {
      --primary-color: #007bff;
      --card-bg: rgba(255, 255, 255, 0.4);
      --win11-hover: rgba(0, 0, 0, 0.05);
      --win11-select: rgba(0, 120, 215, 0.12);
      --win11-select-border: rgba(0, 120, 215, 0.3);
      --border-color: rgba(0, 0, 0, 0.08);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    .bg-fixed-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("./background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
      background-color: #444;
      transition: background-image 0.3s ease-in-out;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.03);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      display: block;
      position: relative;
      height: 100vh;
      box-sizing: border-box;
    }

    .sidebar {
      background: var(--card-bg);
      padding: 30px 20px 22px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: fixed;
      top: 40px;
      width: 240px;
      z-index: 100;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 10px auto 15px;
      display: block;
      object-fit: cover;
    }

    .nav-menu {
      list-style: none;
      padding: 20px 0 0;
      margin: 20px 0 0;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      text-align: left;
    }

    .nav-menu li {
      margin-bottom: 8px;
    }

    .nav-menu li:last-child {
      margin-bottom: 0;
    }

    .nav-menu a {
      display: block;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      transition: 0.2s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      background: rgba(0, 123, 255, 0.1);
      color: var(--primary-color);
    }

    .section-helper[hidden],
    .view-toggle[hidden],
    .w11-toolbar[hidden] {
      display: none !important;
    }

    .nav-link-external {
      display: flex !important;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
    }

    .ext-arrow {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .ext-arrow svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .w11-back-btn img,
    .w11-item-name img {
      width: 20px;
      height: 20px;
      display: block;
      flex: 0 0 auto;
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 21, 28, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.28s ease, visibility 0.28s ease;
      z-index: 300;
      box-sizing: border-box;
    }

    .intro-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .intro-modal {
      width: min(760px, 92vw);
      max-height: min(82vh, 720px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 26px 28px;
      transform: translateY(26px);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.2, 0.85, 0.28, 1), opacity 0.32s ease;
      box-sizing: border-box;
    }

    .intro-overlay.is-open .intro-modal {
      transform: translateY(0);
      opacity: 1;
    }

    .intro-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .intro-title {
      margin: 0;
      font-size: 1.45rem;
      color: #1a1a1a;
    }

    .intro-close {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.06);
      color: #333;
      font-size: 20px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .intro-close:hover {
      background: rgba(0, 0, 0, 0.12);
    }

    .intro-body {
      color: #2c2c2c;
      font-size: 1rem;
      line-height: 1.85;
    }

    main {
      margin-left: 310px;
      height: calc(100vh - 80px);
    }

    .section-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 0;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #files.section-card {
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 4px;
      margin-bottom: 5px;
    }

    .section-title-new {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .view-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      user-select: none;
    }

    .toggle-option {
      cursor: pointer;
      color: #666;
      font-weight: 500;
      padding: 2px 4px;
      position: relative;
      transition: color 0.2s ease, font-weight 0.2s ease;
    }

    .toggle-option:hover {
      color: var(--primary-color);
    }

    .toggle-option.active {
      color: var(--primary-color);
      font-weight: 600;
    }

    .toggle-option::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: var(--primary-color);
      transition: width 0.2s ease, left 0.2s ease;
      border-radius: 2px;
    }

    .toggle-option.active::after {
      width: 100%;
      left: 0;
    }

    .toggle-separator {
      color: rgba(0, 0, 0, 0.15);
      font-weight: 300;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .view-toggle {
        width: 100%;
        box-sizing: border-box;
        justify-content: flex-start;
      }
      .toggle-option::after {
        bottom: -4px;
      }
    }

    .w11-explorer {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.32) !important;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      height: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .w11-toolbar {
      padding: 12px;
      background: rgba(255, 255, 255, 0.2) !important;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .w11-back-btn {
      cursor: pointer;
      border: none;
      background: none;
      display: flex;
      padding: 6px;
      border-radius: 4px;
    }

    .w11-back-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .w11-back-btn:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.08);
    }

    .w11-addr {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.6) !important;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      font-size: 13px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .crumb {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      color: #444;
      flex-shrink: 0;
    }

    .crumb:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .crumb-separator {
      color: #ccc;
      flex-shrink: 0;
    }

    .w11-content {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-top: 2px;
    }

    .w11-content::-webkit-scrollbar {
      display: none;
    }

    .w11-header {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 0 20px;
      align-items: center;
      height: 32px;
      font-size: 12px;
      color: #777;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.1);
    }

    .w11-item {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 8px 20px;
      align-items: center;
      margin: 3px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.1s, border-color 0.1s;
      cursor: default;
    }

    .w11-item:hover {
      background: var(--win11-hover) !important;
    }

    .w11-item.selected {
      background: var(--win11-select) !important;
      border: 1px solid var(--win11-select-border);
    }

    .w11-item-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #111;
      min-width: 0;
    }

    .w11-item-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .w11-item-desc {
      font-size: 12px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .w11-empty {
      color: #666;
      font-size: 13px;
    }

    #toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10010;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .toast {
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 24px;
      border-radius: 9999px;
      box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastSlideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: auto;
      line-height: 1.5;
      max-width: 400px;
      word-break: break-all;
      grid-area: 1 / 1;
    }

    .toast.success {
      background: #10b981;
      color: white;
      border: none;
    }

    .toast.error {
      background: #ef4444;
      color: white;
      border: none;
    }

    .toast.warning {
      background: #f59e0b;
      color: white;
      border: none;
    }

    @keyframes toastSlideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toastFadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    .w11-search {
      margin-left: auto;
      display: flex;
      position: relative;
    }

    .w11-search-input {
      width: 200px;
      padding: 6px 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.8);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .w11-search-input:focus {
      border-color: #007bff;
      background: #fff;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        top: 0;
        width: auto;
        margin-bottom: 20px;
      }

      main {
        margin-left: 0;
      }

      .container {
        padding: 20px 10px;
        height: auto;
      }

      .w11-header,
      .w11-item {
        grid-template-columns: 1fr 100px;
      }

      .w11-toolbar {
        flex-wrap: wrap;
      }

      .w11-search {
        width: 100%;
        margin-left: 0;
      }

      .w11-search-input {
        width: 100%;
      }

      body {
        height: auto;
        overflow-y: auto;
      }

      main {
        height: auto;
      }

      #files.section-card {
        height: auto;
      }

      .w11-explorer {
        height: 520px;
      }
    }

    @media (max-width: 768px) {
      html {
        height: auto;
        min-height: 100%;
        overflow-y: auto;
      }

      body {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .bg-overlay {
        background: rgba(255, 255, 255, 0.16);
      }

      .container {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        height: auto;
        overflow: visible;
        padding: 12px clamp(10px, 3vw, 16px) calc(110px + env(safe-area-inset-bottom, 0px));
      }

      .sidebar {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        column-gap: 14px;
        row-gap: 4px;
        align-items: center;
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 14px;
        text-align: left;
      }

      .avatar {
        grid-row: 1 / span 2;
        width: 64px;
        height: 64px;
        margin: 0;
      }

      .sidebar h1 {
        margin: 0 !important;
        font-size: 1.35rem !important;
        line-height: 1.2;
      }

      .sidebar p {
        margin: 0 !important;
        font-size: 0.86rem !important;
        line-height: 1.45 !important;
      }

      .nav-menu {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 12px 0 0;
        margin: 12px 0 0;
      }

      .nav-menu li {
        margin: 0;
      }

      .nav-menu a,
      .nav-link-external {
        min-height: 40px;
        display: flex !important;
        align-items: center;
        justify-content: center;
        padding: 8px 6px;
        font-size: 0.9rem;
        line-height: 1.25;
        text-align: center;
      }

      main {
        margin-left: 0;
        height: auto;
        min-height: 0;
      }

      .section-card {
        padding: 16px 14px;
        border-radius: 14px;
        margin-bottom: 16px;
      }

      #files.section-card {
        height: auto;
        min-height: 0;
        margin-left: clamp(6px, 2vw, 10px);
        margin-right: clamp(6px, 2vw, 10px);
      }

      .section-header {
        gap: 12px;
        padding-bottom: 10px;
        margin-bottom: 8px;
      }

      .section-title-new {
        font-size: 1.25rem;
      }

      .view-toggle {
        width: 100%;
        gap: 6px;
        line-height: 1.25;
      }

      .toggle-option {
        padding: 6px 2px;
        font-size: 0.9rem;
      }

      .toggle-separator {
        margin: 0 2px;
      }

      .section-helper {
        margin: 6px 0 12px !important;
        color: #4f5b66 !important;
        font-size: 0.78rem !important;
        line-height: 1.5;
      }

      .w11-explorer {
        height: auto;
        min-height: 0;
        overflow: visible;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.52) !important;
      }

      .w11-toolbar {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        padding: 10px;
      }

      .w11-back-btn {
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.45);
        touch-action: manipulation;
      }

      .w11-addr {
        min-width: 0;
        height: 40px;
        padding: 0 10px;
        font-size: 0.9rem;
        box-sizing: border-box;
      }

      .w11-search {
        grid-column: 1 / -1;
        width: 100%;
        margin-left: 0;
      }

      .w11-search-input {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border-radius: 8px;
        font-size: 16px;
      }

      .w11-header {
        display: none;
      }

      .w11-content {
        overflow: visible;
        padding: 8px;
      }

      #file-list {
        display: grid;
        gap: 8px;
      }

      .w11-item {
        display: grid;
        grid-template-columns: 1fr;
        gap: 5px;
        align-items: start;
        margin: 0;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.42);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(0, 123, 255, 0.12);
      }

      .w11-item-name {
        align-items: flex-start;
        gap: 9px;
        font-size: 0.95rem;
        line-height: 1.35;
      }

      .w11-item-name img {
        flex: 0 0 auto;
        width: 22px !important;
        height: 22px !important;
        margin-top: 1px;
      }

      .w11-item-name span {
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        word-break: break-word;
      }

      .w11-item-desc {
        padding-left: 31px;
        color: #55606a;
        font-size: 0.8rem;
        line-height: 1.45;
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        word-break: break-word;
      }

      .w11-empty {
        color: #4f5b66;
      }

      .toast {
        max-width: calc(100vw - 32px);
        border-radius: 9999px;
      }

      .intro-modal {
        width: calc(100vw - 24px);
        padding: 20px;
        border-radius: 14px;
      }

      .intro-body {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding-right: 8px;
        padding-left: 8px;
      }

      .sidebar {
        grid-template-columns: 58px minmax(0, 1fr);
        column-gap: 12px;
      }

      .avatar {
        width: 56px;
        height: 56px;
      }

      .nav-menu {
        gap: 6px;
      }

      .nav-menu a,
      .nav-link-external {
        min-height: 38px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-fixed-layer"></div>
  <div class="bg-overlay"></div>
  <div id="toast-container"></div>

  <div class="container">
    <aside class="sidebar">
      <img
        src="./avatar.png"
        class="avatar"
        alt="头像"
        onerror="this.src='./assets/icons/avatar-fallback.png'"
      >

      <h1 style="margin: 10px 0 5px; font-size: 1.5rem;">殺手</h1>

      <p style="font-size: 0.9rem; color: #555; line-height: 1.6;">
        君子坐而论道<br>
        少年起而行之
      </p>

      <ul class="nav-menu">
        <li>
          <a href="#" id="open-files-link" class="nav-link active">
            <span>学习资料</span>
          </a>
        </li>
        <li>
          <a href="#" id="open-links-link" class="nav-link">
            <span>友情链接</span>
          </a>
        </li>
        <li>
          <a href="#" id="open-intro-link" class="nav-link nav-link-external">
            <span>查看网站介绍</span>
          </a>
        </li>
      </ul>
    </aside>

    <main>
      <section id="files" class="section-card">
        <div class="section-header">
          <h2 id="section-title" class="section-title-new">学习资料</h2>
          <div id="view-toggle" class="view-toggle">
            <span class="toggle-option active" id="toggle-course">以课程展示</span>
            <span class="toggle-separator">|</span>
            <span class="toggle-option" id="toggle-time">以时间顺序展示</span>
          </div>
        </div>

        <p id="section-helper" class="section-helper" style="font-size: 0.85rem; color: #888; margin-bottom: 10px; margin-top: 10px;">
          宽屏电脑双击打开，手机或窄屏点击即可进入或下载，PDF 默认在浏览器中打开
        </p>

        <div class="w11-explorer">
          <div id="file-toolbar" class="w11-toolbar">
            <button id="back-btn" class="w11-back-btn" type="button">
              <img src="./assets/icons/back.png" alt="返回">
            </button>

            <div id="address-bar" class="w11-addr"></div>

            <div class="w11-search">
              <input
                id="search-input"
                type="text"
                class="w11-search-input"
                placeholder="搜索文件或文件夹..."
              >
            </div>
          </div>

          <div class="w11-header">
            <div id="primary-column-heading">名称</div>
            <div>说明</div>
          </div>
          <div class="w11-content">
            <div id="file-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="intro-overlay" class="intro-overlay" role="dialog" aria-modal="true" aria-labelledby="intro-modal-title">
    <section class="intro-modal">
      <div class="intro-header">
        <h2 id="intro-modal-title" class="intro-title">网站介绍</h2>
        <button id="close-intro-btn" class="intro-close" type="button" aria-label="关闭简介窗口">×</button>
      </div>
      <div class="intro-body">
        这是借助 Codex、Antigravity 与 Github Pages 搭建的个人网站。你可以在这里下载我整理的资料。<br>
        如果您发现资料缺失/需要补充资料, 欢迎联系 syh080315@gmail.com。<br>
        手机端点击条目即可进入或打开资料。
      </div>
    </section>
  </div>

  <script src="./filedata.js"></script>
  <script src="./links.js"></script>
  <script>
    (function () {
      var timeDb = window.FILE_DB || {};
      var friendLinks = Array.isArray(window.FRIEND_LINKS) ? window.FRIEND_LINKS : [];

      function isTermFolderName(name) {
        return /^(?:\d+|[\u4e00-\u9fa5]+)(?:\u6625|\u79cb)$/.test(String(name || ""));
      }

      function cloneFileNode(node) {
        if (!node || typeof node !== "object") {
          return {};
        }

        var copy = {};
        Object.keys(node).forEach(function (key) {
          if (key === "children") {
            copy.children = cloneChildren(node.children || {});
          } else {
            copy[key] = node[key];
          }
        });
        return copy;
      }

      function cloneChildren(children) {
        var copy = {};
        Object.entries(children || {}).forEach(function (entry) {
          copy[entry[0]] = cloneFileNode(entry[1]);
        });
        return copy;
      }

      function mergeFolderChildren(target, source) {
        Object.entries(source.children || {}).forEach(function (entry) {
          var name = entry[0];
          var sourceChild = entry[1];
          var targetChild = target.children[name];

          if (
            targetChild &&
            targetChild.type === "folder" &&
            sourceChild &&
            sourceChild.type === "folder"
          ) {
            mergeFolderChildren(targetChild, sourceChild);
            return;
          }

          target.children[name] = cloneFileNode(sourceChild);
        });
      }

      function addCourseNode(courseDb, name, node) {
        var existing = courseDb[name];
        if (existing && existing.type === "folder" && node && node.type === "folder") {
          mergeFolderChildren(existing, node);
          return;
        }
        courseDb[name] = cloneFileNode(node);
      }

      function buildCourseDb(sourceDb) {
        var courseDb = {};

        Object.entries(sourceDb || {}).forEach(function (entry) {
          var name = entry[0];
          var node = entry[1];

          if (isTermFolderName(name) && node && node.type === "folder") {
            Object.entries(node.children || {}).forEach(function (childEntry) {
              addCourseNode(courseDb, childEntry[0], childEntry[1]);
            });
            return;
          }

          addCourseNode(courseDb, name, node);
        });

        return courseDb;
      }

      var loadedDbs = {
        course: buildCourseDb(timeDb),
        time: timeDb
      };
      var db = loadedDbs.course;
      var activeView = "course"; // "course" or "time"
      var activeContent = "files"; // "files" or "links"

      var state = {
        currentPath: [],
        selectedKey: "",
        searchQuery: ""
      };

      var iconMap = {
        folder: "./assets/icons/folder.png",
        pdf: "./assets/icons/pdf.png",
        ppt: "./assets/icons/ppt.png",
        pptx: "./assets/icons/ppt.png",
        xls: "./assets/icons/xls.png",
        xlsx: "./assets/icons/xls.png",
        doc: "./assets/icons/doc.png",
        docx: "./assets/icons/doc.png",
        zip: "./assets/icons/archive.png",
        "7z": "./assets/icons/archive.png",
        rar: "./assets/icons/archive.png",
        mp3: "./assets/icons/audio.png",
        wav: "./assets/icons/audio.png",
        m4a: "./assets/icons/audio.png",
        mkv: "./assets/icons/video.png",
        mp4: "./assets/icons/video.png",
        mov: "./assets/icons/video.png",
        link: "./assets/icons/link.png",
        default: "./assets/icons/file.png"
      };

      var fileListEl = document.getElementById("file-list");
      var searchInputEl = document.getElementById("search-input");
      var backButtonEl = document.getElementById("back-btn");
      var addressBarEl = document.getElementById("address-bar");
      var fileToolbarEl = document.getElementById("file-toolbar");
      var sectionTitleEl = document.getElementById("section-title");
      var sectionHelperEl = document.getElementById("section-helper");
      var primaryColumnHeadingEl = document.getElementById("primary-column-heading");
      var viewToggleEl = document.getElementById("view-toggle");
      var openFilesLinkEl = document.getElementById("open-files-link");
      var openLinksLinkEl = document.getElementById("open-links-link");
      var openIntroLinkEl = document.getElementById("open-intro-link");
      var introOverlayEl = document.getElementById("intro-overlay");
      var closeIntroBtnEl = document.getElementById("close-intro-btn");
      var toastContainerEl = document.getElementById("toast-container");
      var toggleTimeEl = document.getElementById("toggle-time");
      var toggleCourseEl = document.getElementById("toggle-course");

      function getCurrentNode() {
        var node = db;
        var i;
        for (i = 0; i < state.currentPath.length; i += 1) {
          var part = state.currentPath[i];
          if (!node[part] || !node[part].children) {
            return {};
          }
          node = node[part].children;
        }
        return node;
      }

      function buildItemKey(pathArray, name) {
        return pathArray.concat(name).join("/");
      }

      function searchFiles(node, query, pathAcc, result) {
        Object.entries(node).forEach(function (entry) {
          var name = entry[0];
          var info = entry[1] || {};
          var desc = typeof info.desc === "string" ? info.desc.toLowerCase() : "";
          var isMatch = name.toLowerCase().indexOf(query) !== -1 || desc.indexOf(query) !== -1;

          if (isMatch) {
            result.push({
              name: name,
              info: info,
              virtualPath: pathAcc.slice(),
              key: buildItemKey(pathAcc, name)
            });
          }

          if (info.children && isItemPublic(info)) {
            searchFiles(info.children, query, pathAcc.concat(name), result);
          }
        });
      }

      function getVisibleItems() {
        var query = state.searchQuery.trim().toLowerCase();
        if (query) {
          var searchResults = [];
          searchFiles(db, query, [], searchResults);
          return searchResults;
        }

        var currentData = getCurrentNode();
        var items = Object.entries(currentData).map(function (entry) {
          return {
            name: entry[0],
            info: entry[1],
            key: buildItemKey(state.currentPath, entry[0]),
            virtualPath: null
          };
        });

        if (activeView === "course" && state.currentPath.length === 0) {
          items.sort(function (a, b) {
            return a.name.localeCompare(b.name, "zh-CN");
          });
        }

        return items;
      }

      function getVisibleLinks() {
        return friendLinks
          .filter(function (link) {
            return link && typeof link === "object";
          })
          .map(function (link, index) {
            return {
              title: String(link.title || "未命名链接"),
              desc: String(link.desc || ""),
              url: String(link.url || ""),
              key: "link-" + index
            };
          });
      }

      function getIcon(name, info) {
        if (info.type === "folder") {
          return iconMap.folder;
        }
        var parts = name.split(".");
        var ext = parts.length > 1 ? parts[parts.length - 1].toLowerCase() : "";
        return iconMap[ext] || iconMap.default;
      }

      function preloadIcons() {
        var seen = {};
        Object.keys(iconMap).forEach(function (key) {
          var url = iconMap[key];
          if (seen[url]) {
            return;
          }
          seen[url] = true;
          var image = new Image();
          image.decoding = "async";
          image.src = url;
        });
      }

      function getDescriptionText(info) {
        var desc = info && typeof info.desc === "string" ? info.desc.trim() : "";
        return desc ? desc : "（空）";
      }

      function isItemPublic(info) {
        return !(info && (info.isPublic === false || info.public === false || info.is_public === false));
      }

      function showToast(message, type) {
        if (!toastContainerEl) {
          return;
        }

        while (toastContainerEl.firstChild) {
          toastContainerEl.removeChild(toastContainerEl.firstChild);
        }

        var toast = document.createElement("div");
        toast.className = "toast " + (type || "");
        toast.textContent = message;
        toastContainerEl.appendChild(toast);

        window.setTimeout(function () {
          toast.style.animation = "toastFadeOut 0.2s ease-in forwards";
          toast.addEventListener("animationend", function () {
            if (toast.parentNode) {
              toast.parentNode.removeChild(toast);
            }
          });
        }, 2200);
      }

      function jumpTo(index) {
        if (index === -1) {
          state.currentPath = [];
        } else {
          state.currentPath = state.currentPath.slice(0, index + 1);
        }
        state.selectedKey = "";
        renderExplorer();
      }

      function handleOpen(item) {
        var name = item.name;
        var info = item.info || {};

        if (!isItemPublic(info)) {
          showToast("未公开文件", "error");
          return;
        }

        if (info.type === "folder") {
          if (item.virtualPath) {
            state.currentPath = item.virtualPath.concat(name);
            state.searchQuery = "";
            searchInputEl.value = "";
          } else {
            state.currentPath = state.currentPath.concat(name);
          }
          state.selectedKey = "";
          renderExplorer();
          return;
        }

        if (info.url) {
          window.open(encodeURI(info.url), "_blank");
        }
      }

      function handleOpenLink(link) {
        var targetUrl = normalizeExternalUrl(link.url);
        if (targetUrl) {
          window.open(encodeURI(targetUrl), "_blank", "noopener,noreferrer");
        }
      }

      function normalizeExternalUrl(url) {
        var normalized = String(url || "").trim();
        if (!normalized) {
          return "";
        }
        if (/^[a-z][a-z0-9+.-]*:/i.test(normalized)) {
          return normalized;
        }
        return "https://" + normalized;
      }

      function shouldOpenOnSingleClick() {
        var isCoarsePointer = window.matchMedia &&
          window.matchMedia("(hover: none), (pointer: coarse)").matches;
        var isNarrowLayout = window.matchMedia ?
          window.matchMedia("(max-width: 768px)").matches :
          window.innerWidth <= 768;
        return isNarrowLayout || isCoarsePointer;
      }

      function markSelectedRow(row, key) {
        state.selectedKey = key;
        Array.from(fileListEl.querySelectorAll(".w11-item.selected")).forEach(function (selectedRow) {
          selectedRow.classList.remove("selected");
        });
        row.classList.add("selected");
      }

      function bindInteractiveRow(row, key, openCallback) {
        row.tabIndex = 0;
        row.setAttribute("role", "button");

        row.addEventListener("click", function (event) {
          event.stopPropagation();
          if (shouldOpenOnSingleClick()) {
            openCallback();
            return;
          }
          markSelectedRow(row, key);
        });

        row.addEventListener("dblclick", function (event) {
          event.stopPropagation();
          openCallback();
        });

        row.addEventListener("keydown", function (event) {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          openCallback();
        });
      }

      function renderAddressBar() {
        addressBarEl.innerHTML = "";

        if (state.searchQuery.trim()) {
          var searchLabel = document.createElement("span");
          searchLabel.className = "crumb";
          searchLabel.style.color = "#666";
          searchLabel.textContent = "搜索结果: \"" + state.searchQuery.trim() + "\"";
          addressBarEl.appendChild(searchLabel);
          return;
        }

        var homeCrumb = document.createElement("span");
        homeCrumb.className = "crumb";
        homeCrumb.textContent = "首页";
        homeCrumb.addEventListener("click", function () {
          jumpTo(-1);
        });
        addressBarEl.appendChild(homeCrumb);

        state.currentPath.forEach(function (pathName, idx) {
          var sep = document.createElement("span");
          sep.className = "crumb-separator";
          sep.textContent = " > ";
          addressBarEl.appendChild(sep);

          var pathCrumb = document.createElement("span");
          pathCrumb.className = "crumb";
          pathCrumb.textContent = pathName;
          pathCrumb.addEventListener("click", function () {
            jumpTo(idx);
          });
          addressBarEl.appendChild(pathCrumb);
        });
      }

      function renderFileList() {
        fileListEl.innerHTML = "";
        var items = getVisibleItems();

        if (!items.length) {
          var emptyRow = document.createElement("div");
          emptyRow.className = "w11-item w11-empty";
          emptyRow.innerHTML = "<div>暂无匹配项目</div><div>—</div>";
          fileListEl.appendChild(emptyRow);
          return;
        }

        items.forEach(function (item) {
          var row = document.createElement("div");
          row.className = "w11-item" + (state.selectedKey === item.key ? " selected" : "");
          row.setAttribute("aria-label", "打开 " + item.name);
          bindInteractiveRow(row, item.key, function () {
            handleOpen(item);
          });

          var leftCol = document.createElement("div");
          leftCol.className = "w11-item-name";

          var icon = document.createElement("img");
          icon.src = getIcon(item.name, item.info || {});
          icon.alt = "icon";
          icon.loading = "eager";
          icon.decoding = "async";
          leftCol.appendChild(icon);

          var nameSpan = document.createElement("span");
          if (item.virtualPath) {
            nameSpan.title = item.virtualPath.concat(item.name).join(" > ");
          } else {
            nameSpan.title = item.name;
          }
          nameSpan.textContent = item.name;
          leftCol.appendChild(nameSpan);

          var rightCol = document.createElement("div");
          rightCol.className = "w11-item-desc";
          rightCol.textContent = getDescriptionText(item.info);
          rightCol.title = rightCol.textContent;

          row.appendChild(leftCol);
          row.appendChild(rightCol);
          fileListEl.appendChild(row);
        });
      }

      function renderLinkList() {
        fileListEl.innerHTML = "";
        var links = getVisibleLinks();

        if (!links.length) {
          var emptyRow = document.createElement("div");
          emptyRow.className = "w11-item w11-empty";
          emptyRow.innerHTML = "<div>暂无友情链接</div><div>—</div>";
          fileListEl.appendChild(emptyRow);
          return;
        }

        links.forEach(function (link) {
          var row = document.createElement("div");
          row.className = "w11-item" + (state.selectedKey === link.key ? " selected" : "");
          row.setAttribute("aria-label", "打开链接 " + link.title);
          bindInteractiveRow(row, link.key, function () {
            handleOpenLink(link);
          });

          var leftCol = document.createElement("div");
          leftCol.className = "w11-item-name";

          var icon = document.createElement("img");
          icon.src = iconMap.link;
          icon.alt = "icon";
          icon.loading = "eager";
          icon.decoding = "async";
          leftCol.appendChild(icon);

          var titleSpan = document.createElement("span");
          titleSpan.title = link.title;
          titleSpan.textContent = link.title;
          leftCol.appendChild(titleSpan);

          var rightCol = document.createElement("div");
          rightCol.className = "w11-item-desc";
          rightCol.textContent = link.desc || "（空）";
          rightCol.title = rightCol.textContent;

          row.appendChild(leftCol);
          row.appendChild(rightCol);
          fileListEl.appendChild(row);
        });
      }

      function renderExplorer() {
        var isFiles = activeContent === "files";
        sectionTitleEl.textContent = isFiles ? "学习资料" : "友情链接";
        viewToggleEl.hidden = !isFiles;
        sectionHelperEl.hidden = !isFiles;
        fileToolbarEl.hidden = !isFiles;
        primaryColumnHeadingEl.textContent = isFiles ? "名称" : "标题";
        openFilesLinkEl.classList.toggle("active", isFiles);
        openLinksLinkEl.classList.toggle("active", !isFiles);

        if (isFiles) {
          backButtonEl.disabled = state.currentPath.length === 0;
          renderAddressBar();
          renderFileList();
        } else {
          renderLinkList();
        }
      }

      backButtonEl.addEventListener("click", function () {
        if (state.currentPath.length > 0) {
          state.currentPath = state.currentPath.slice(0, state.currentPath.length - 1);
          state.selectedKey = "";
          renderExplorer();
        }
      });

      searchInputEl.addEventListener("input", function (event) {
        state.searchQuery = event.target.value || "";
        state.selectedKey = "";
        renderExplorer();
      });

      function switchView(viewType) {
        if (viewType === activeView) {
          return;
        }

        if (viewType === "course") {
          activeView = "course";
          db = loadedDbs.course;
          toggleCourseEl.classList.add("active");
          toggleTimeEl.classList.remove("active");
          
          state.currentPath = [];
          state.selectedKey = "";
          state.searchQuery = "";
          searchInputEl.value = "";
          renderExplorer();
        } else if (viewType === "time") {
          activeView = "time";
          db = loadedDbs.time;
          toggleCourseEl.classList.remove("active");
          toggleTimeEl.classList.add("active");

          state.currentPath = [];
          state.selectedKey = "";
          state.searchQuery = "";
          searchInputEl.value = "";
          renderExplorer();
        }
      }

      function resetFileState() {
        state.currentPath = [];
        state.selectedKey = "";
        state.searchQuery = "";
        searchInputEl.value = "";
      }

      function switchContent(contentType) {
        if (contentType === activeContent) {
          return;
        }

        activeContent = contentType;
        resetFileState();
        renderExplorer();
      }

      toggleTimeEl.addEventListener("click", function () {
        switchView("time");
      });

      toggleCourseEl.addEventListener("click", function () {
        switchView("course");
      });

      openFilesLinkEl.addEventListener("click", function (event) {
        event.preventDefault();
        switchContent("files");
      });

      openLinksLinkEl.addEventListener("click", function (event) {
        event.preventDefault();
        switchContent("links");
      });

      function openIntroModal() {
        introOverlayEl.classList.add("is-open");
      }

      function closeIntroModal() {
        introOverlayEl.classList.remove("is-open");
      }

      openIntroLinkEl.addEventListener("click", function (event) {
        event.preventDefault();
        openIntroModal();
      });

      closeIntroBtnEl.addEventListener("click", function () {
        closeIntroModal();
      });

      introOverlayEl.addEventListener("click", function (event) {
        if (event.target === introOverlayEl) {
          closeIntroModal();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && introOverlayEl.classList.contains("is-open")) {
          closeIntroModal();
        }
      });

      document.addEventListener("click", function () {
        if (state.selectedKey !== "") {
          state.selectedKey = "";
          renderExplorer();
        }
      });

      preloadIcons();
      renderExplorer();
    })();
  </script>
</body>
</html>
